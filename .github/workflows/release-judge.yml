name: release-judge
run-name: release-judge ${{ inputs.tag }}

# Blind judge for the release-notes bench: one job per pair. The judge sees the published notes, the commit subjects and
# two candidate notes labelled A and B. Arm names and the A/B key are not in the judge files. Direct API, no gateway.
on:
  workflow_dispatch:
    inputs:
      ids: { type: string, required: true, description: "JSON array of judge ids" }
      tag: { type: string, default: "" }

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        id: ${{ fromJSON(inputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code (native installer)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Judge
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_B }}
        run: |
          mkdir -p out
          claude -p "You are a strict, blind judge of two candidate release notes for the same release. Read lab/release/judge/${{ matrix.id }}.md: it holds the maintainers' published notes, the commit subjects of the release, then CANDIDATE A and CANDIDATE B. For each candidate: (1) coverage: of the user-facing changes in the published notes, how many does it describe, as a fraction 0 to 1; (2) false claims: statements that the commit subjects and published notes do not support or that contradict them; (3) usefulness 1-10 for a user deciding whether to upgrade (accurate, specific, plain language, no noise). Then pick the better candidate: A, B or tie (tie when scores differ by 1 or less and false claims are equal). Do not guess which tool wrote a candidate. Output only one JSON object: {\"cov_a\":x,\"cov_b\":x,\"false_a\":n,\"false_b\":n,\"score_a\":n,\"score_b\":n,\"winner\":\"A|B|tie\",\"why\":\"one sentence\"}" \
            --output-format json --model claude-sonnet-5-5 --max-turns 8 --allowedTools "Read" > out/${{ matrix.id }}.json
      - name: Secret check
        if: always()
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY_B }}
        run: if [ -n "$K" ] && grep -rlF "$K" out/ ; then echo "::error::key found"; rm -rf out; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judge-${{ matrix.id }}
          path: out/
          if-no-files-found: ignore
