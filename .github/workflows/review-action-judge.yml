name: review-action-judge
run-name: review-action-judge ${{ inputs.tag }}

# Blind judge for the review-action bench: one job per pair. The judge sees the real PR diff and two reviews labelled A and B.
# Arm names and the A/B key are not in the judge files (the key stays outside the repo). Direct API, no gateway.
on:
  workflow_dispatch:
    inputs:
      ids: { type: string, required: true, description: "JSON array of judge ids, e.g. [\"j00\",\"j01\"]" }
      tag: { type: string, default: "" }

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        id: ${{ fromJSON(inputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code (native installer)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Judge
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_B }}
        run: |
          mkdir -p out
          claude -p "You are a strict, blind judge of two code reviews of the same pull request. Read lab/review-action/judge/${{ matrix.id }}.md: it holds the real PR diff, then REVIEW A and REVIEW B. For each review, check every finding against the diff (file, line, and the claim itself). Count findings that are false or not supported by the diff as false claims. Score each review 1-10 for usefulness to the PR author (correct, specific, actionable, no noise). Then pick the better review: A, B or tie (use tie when the scores differ by 1 or less and false claims are equal). Do not guess which tool wrote a review. Output only one JSON object: {\"score_a\":n,\"score_b\":n,\"false_a\":n,\"false_b\":n,\"findings_a\":n,\"findings_b\":n,\"winner\":\"A|B|tie\",\"why\":\"one sentence\"}" \
            --output-format json --model claude-sonnet-5-5 --max-turns 8 --allowedTools "Read" > out/${{ matrix.id }}.json
      - name: Secret check
        if: always()
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY_B }}
        run: if [ -n "$K" ] && grep -rlF "$K" out/ ; then echo "::error::key found"; rm -rf out; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rajudge-${{ matrix.id }}
          path: out/
          if-no-files-found: ignore
