name: keycheck
on: workflow_dispatch
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - env: { A: "${{ secrets.ANTHROPIC_API_KEY }}", B: "${{ secrets.ANTHROPIC_API_KEY_B }}" }
        run: |
          for n in A B; do v="${!n}"; echo "$n len=${#v} prefix=${v:0:10}"; curl -s https://api.anthropic.com/v1/messages -H "x-api-key: $v" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" -d '{"model":"claude-haiku-5-5","max_tokens":5,"messages":[{"role":"user","content":"hi"}]}' | head -c 200; echo; done
